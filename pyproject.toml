[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "topo-spectral-interp"
version = "0.1.0"
description = "Topological-spectral multiview descriptor of transformer activations across the grokking transition"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Cesar Daniel Reinoso" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "networkx>=3.0",
  "ripser>=0.6.4",
  "torch>=2.1",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "threadpoolctl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["networkx.*", "ripser.*", "sklearn.*", "scipy.*", "matplotlib.*", "threadpoolctl.*"]
ignore_missing_imports = true
